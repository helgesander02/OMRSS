# Network Parameters
# ------------------
network:
  # Topology architecture options: 
  # - typical_complex
  # - typical_simple
  # - ring
  # - layered_ring
  # - industrial
  topology: "typical_complex"
  
  # Greatest Common Divisor of Simulated Time LCM (microseconds)
  hyperperiod: 6000
  
  # Network bandwidth (bits per second)
  # Default: 1e9 (1 Gbps)
  bandwidth: 1000000000
  
  flows:
    # Routing mode for TT flows:
    #   - "tree": each flow has multiple destinations (multicast), used by OMACO
    #   - "path": each flow has a single destination (unicast), used by OSRO
    routing_mode: "tree"
    # TSN (Time-Sensitive Networking) flows
    tsn:
      input: 35       # Number of TSN input flows
      background: 35  # Number of TSN background flows
      
      # TSN flow parameters
      params:
        periods: [100, 500, 1000, 1500, 2000]  # Possible period values (microseconds)
        datasizes: [30, 40, 50, 60, 70, 80, 90, 100]  # Possible data size values (bytes)
    
    # AVB (Audio Video Bridging) flows
    avb:
      input: 15       # Number of AVB input flows
      background: 15  # Number of AVB background flows
      
      # AVB flow parameters
      params:
        period: 125     # Period in microseconds (fixed value)
        deadline: 2000  # Deadline in microseconds (fixed value)
        datasizes: [1000, 1100, 1200, 1300, 1400, 1500]  # Possible data size values (bytes)
    
    # CAN (Controller Area Network) flows
    can:
      nodes: 5        # Number of CAN nodes randomly selected from topology
      important: 5    # Number of CAN important flows
      unimportant: 25 # Number of CAN unimportant flows
      
      # CAN flow parameters
      params:
        # Important CAN flow characteristics
        important_params:
          period: 5000     # Period in microseconds
          deadline: 5000   # Deadline in microseconds (typically equal to period)
          datasize: 16     # Data size in bytes
        
        # Unimportant CAN flow characteristics
        unimportant_params:
          periods: [50000, 100000, 150000]  # Possible period values (microseconds)
          deadlines: [10000, 12000, 14000, 16000, 18000, 20000]  # Possible deadline values (microseconds)
          datasize: 16     # Data size in bytes

# Algorithm Parameters
# --------------------
algorithm:
  # Algorithm selection: omaco, osro
  name: "omaco"
  
  # OSACO (Online Stream-Aware Ant Colony Optimization) parameters
  osaco:
    # Timeout in milliseconds
    timeout: 200
    
    # Select K candidates with different weights (trees for OMACO, paths for OSRO)
    k: 5
    
    # Pheromone evaporation coefficient (0.0 - 1.0)
    # The pheromone value of each routing path starts to evaporate
    pheromone_evaporation: 0.7
    
    # Tree selection method number
    # 0: Min Weight
    # 1: Increasing Arithmetic Sequence Weight
    # 2: Average Arithmetic Sequence Weight
    # 3: Min Weight and Tree Edit Distance
    # 4: Tree Edit Distance
    method_number: 0

# Schedule Cost Objectives
# -------------------------
schedule:
  costs:
    o1: 100000000  # Primary objective (highest priority)
    o2: 100000     # Secondary objective
    o3: 0          # Tertiary objective
    o4: 1          # Quaternary objective

# Experiment Parameters
# ----------------------
experiment:
  # Number of test cases to run
  test_cases: 100
  
  # Random seed for reproducibility
  # Set to 42 (or any fixed value) for reproducible experiments
  # Set to 0 to use current timestamp (random each run)
  random_seed: 42

  # Skip plan + memorizer; only generate and dump the network.
  # Useful for inspecting CAN-to-TT encapsulation without paying for scheduling.
  network_only: false

# Output Control
# --------------
output:
  # Verbose network dump: topology cost matrix, per-frame timing, per-emit CAN
  # detail, per-flow routing graphs. The CAN encap summary + comparison table
  # always prints in network-only mode regardless.
  show_network: false

  # Display comprehensive plan information
  show_plan: false

  # Logging level: debug, info, warn, error
  log_level: "info"
